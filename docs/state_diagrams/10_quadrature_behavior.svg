<text text-anchor="middle" x="817" y="-129.4" font-family="Noto Sans CJK KR" font-size="17.00">읽는 기준 / 코드 근거</text>
<text text-anchor="middle" x="817" y="-110.4" font-family="Noto Sans CJK KR" font-size="17.00">rst=1: 입력 동기화 / 이전 위상=00 / 위치·방향·오류 초기화.</text>
<text text-anchor="middle" x="817" y="-91.4" font-family="Noto Sans CJK KR" font-size="17.00">state_now=a_sync(1)&amp;b_sync(1). moved이면 다음 비교용 state를 갱신한다.</text>
<text text-anchor="middle" x="817" y="-72.4" font-family="Noto Sans CJK KR" font-size="17.00">동일 위상은 이동 없음. 불법 전이는 위치와 방향을 바꾸지 않는다.</text>
<text text-anchor="middle" x="817" y="-53.4" font-family="Noto Sans CJK KR" font-size="17.00">position preset이 같은 클럭 이동보다 우선하지만, 오류 검사는 별도 프로세스다.</text>
<text text-anchor="middle" x="817" y="-34.4" font-family="Noto Sans CJK KR" font-size="17.00">clear는 오류 flag만 초기화: illegal count와 timeout_count를 초기화하지 않는다.</text>
<text text-anchor="middle" x="817" y="-15.4" font-family="Noto Sans CJK KR" font-size="17.00">rst 이외에 clear와 새 오류가 겹치면 뒤에 기록되는 새 오류가 우선한다.</text>
</g>
