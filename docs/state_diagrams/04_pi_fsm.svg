<text text-anchor="middle" x="381.75" y="-167.4" font-family="Noto Sans CJK KR" font-size="17.00">읽는 기준 / 코드 근거</text>
<text text-anchor="middle" x="381.75" y="-148.4" font-family="Noto Sans CJK KR" font-size="17.00">clocked_proc / nextstate_proc와 계산 레지스터 프로세스는 병렬 동작.</text>
<text text-anchor="middle" x="381.75" y="-129.4" font-family="Noto Sans CJK KR" font-size="17.00">anti_windup_enable=1 AND</text>
<text text-anchor="middle" x="381.75" y="-110.4" font-family="Noto Sans CJK KR" font-size="17.00">[(proposed_value&gt;4096 AND error_reg&gt;0) OR (proposed_value&lt;0 AND error_reg&lt;0)]</text>
