<text text-anchor="middle" x="381.75" y="-72.4" font-family="Noto Sans CJK KR" font-size="17.00">Kp/Ki: signed 18&#45;bit Q16. ki_gain에는 Ts가 반영되어 있다.</text>
<text text-anchor="middle" x="381.75" y="-53.4" font-family="Noto Sans CJK KR" font-size="17.00">상위 모터에서 rst=controller_reset=rst OR NOT enabled.</text>
<text text-anchor="middle" x="381.75" y="-34.4" font-family="Noto Sans CJK KR" font-size="17.00">노드 동작: 해당 현재 상태에서 처리하는 클럭 기준.</text>
<text text-anchor="middle" x="381.75" y="-15.4" font-family="Noto Sans CJK KR" font-size="17.00">조건 불충족 self&#45;loop는 next_state 기본값=state에서 추출.</text>
</g>
