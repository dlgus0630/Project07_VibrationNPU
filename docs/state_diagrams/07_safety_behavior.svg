<text text-anchor="middle" x="431" y="-110.4" font-family="Noto Sans CJK KR" font-size="17.00">DERATE 구간에서는 warning도 1이다. 정상 분류는 연속 횟수만 초기화한다.</text>
<text text-anchor="middle" x="431" y="-91.4" font-family="Noto Sans CJK KR" font-size="17.00">abnormal_count는 rst에서만 0: clear는 누적 횟수를 보존.</text>
<text text-anchor="middle" x="431" y="-72.4" font-family="Noto Sans CJK KR" font-size="17.00">어느 관측 상태에서나 rst/clear → latch=0 / 연속 계수=0 / 원인=0.</text>
<text text-anchor="middle" x="431" y="-53.4" font-family="Noto Sans CJK KR" font-size="17.00">safety_supervisor의 rst/clear는 새 fault보다 우선한다.</text>
<text text-anchor="middle" x="431" y="-34.4" font-family="Noto Sans CJK KR" font-size="17.00">분류/heartbeat fault는 같은 클럭에 둘 다 기록될 수 있다.</text>
<text text-anchor="middle" x="431" y="-15.4" font-family="Noto Sans CJK KR" font-size="17.00">아래 독립 fault_latch를 위 supervisor 안에 연결한 도면은 아니다.</text>
</g>
<!-- simple&#45;&gt;notes -->
</g>
</svg>
