<svg xmlns="http://www.w3.org/2000/svg" width="2420" height="2170" viewBox="0 0 2420 2170">
<defs><pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="16" height="16" fill="#edf6fb"/><line x1="0" x2="0" y1="0" y2="16" stroke="#d9eaf3" stroke-width="2"/></pattern>
<marker id="bus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#368c47"/></marker>
<marker id="io" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1688b5"/></marker>
<marker id="module" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3f4852"/></marker>
<marker id="clock" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8058a6"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:"Noto Sans CJK KR","DejaVu Sans",sans-serif;fill:#202f3c}.signal{font-family:"DejaVu Sans Mono",monospace;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}.small{fill:#536473}</style>
<text x="60" y="65" text-anchor="start" style="font-size:36px;font-weight:700;">
<tspan x="60" dy="0">FFT / NPU · Internal Signal Architecture</tspan>
</text>
<text x="60" y="110" text-anchor="start" style="font-size:20px;">
<tspan x="60" dy="0">vibration_core_fsm.vhd / npu_2pe_fsm.vhd · 실제 포트 연결 · Sheet 3 / 3</tspan>
</text>
<rect x="280" y="180" width="1870" height="1710" rx="12" fill="url(#hatch)" stroke="#586d7c" stroke-width="2.5"/>
<text x="300" y="216" text-anchor="start" style="font-size:25px;font-weight:700;">
<tspan x="300" dy="0">U_CORE / vibration_core</tspan>
</text>
<rect x="400" y="280" width="590" height="190" rx="15" fill="#ffffff" stroke="#495b69" stroke-width="2.4"/>
<text x="695.0" y="317" text-anchor="middle" style="font-size:23px;font-weight:700;">
<tspan x="695.0" dy="0">순서 제어 / result registers</tspan>
</text>
<text x="695.0" y="353" text-anchor="middle" style="font-size:19px;">
<tspan x="695.0" dy="0">clocked_proc / nextstate_proc</tspan>
<tspan x="695.0" dy="27.169999999999998">result_capture_proc / handshake_proc</tspan>
<tspan x="695.0" dy="27.169999999999998">cycle_count_proc / result_index_proc</tspan>
<tspan x="695.0" dy="27.169999999999998">FFT → NPU → STORE 11 words</tspan>
</text>
<text x="35" y="300" text-anchor="start" style="font-size:22px;" class="signal">
<tspan x="35" dy="0">clk / rst</tspan>
<tspan x="35" dy="31.459999999999997">start</tspan>
</text>
<polyline points="35,365 400,365" fill="none" stroke="#1688b5" stroke-width="4" marker-end="url(#io)"/>
<polyline points="2150,350 2370,350" fill="none" stroke="#1688b5" stroke-width="4" marker-end="url(#io)"/>
<text x="2120" y="245" text-anchor="end" style="font-size:18px;" class="signal">
<tspan x="2120" dy="0">busy / done</tspan>
<tspan x="2120" dy="25.74">cycles[31:0] / npu_cycles[31:0]</tspan>
<tspan x="2120" dy="25.74">features[31:0] / hidden[31:0]</tspan>
<tspan x="2120" dy="25.74">logits[15:0] / class_id</tspan>
</text>
<rect x="400" y="720" width="590" height="250" rx="15" fill="#ffffff" stroke="#495b69" stroke-width="2.4"/>
<text x="695.0" y="757" text-anchor="middle" style="font-size:23px;font-weight:700;">
<tspan x="695.0" dy="0">U_FFT / fft64_features</tspan>
</text>
<text x="695.0" y="793" text-anchor="middle" style="font-size:19px;">
<tspan x="695.0" dy="0">64-point radix-2 FFT</tspan>
<tspan x="695.0" dy="27.169999999999998">Q1.15 twiddle / 각 단계 /2</tspan>
<tspan x="695.0" dy="27.169999999999998">4개 대역 특징 / INT8 범위</tspan>
</text>
<polyline points="550,470 550,720" fill="none" stroke="#3f4852" stroke-width="2.6" marker-end="url(#module)"/>
<text x="570" y="585" text-anchor="start" style="font-size:20px;" class="signal">
<tspan x="570" dy="0">fft_start → start</tspan>
</text>
<polyline points="820,720 820,470" fill="none" stroke="#3f4852" stroke-width="2.6" marker-end="url(#module)"/>
<text x="840" y="585" text-anchor="start" style="font-size:19px;" class="signal">
<tspan x="840" dy="0">fft_busy / fft_done</tspan>
<tspan x="840" dy="27.169999999999998">fft_features[31:0]</tspan>
</text>
<text x="35" y="775" text-anchor="start" style="font-size:19px;" class="signal">
<tspan x="35" dy="0">bram_rdata[31:0]</tspan>
<tspan x="35" dy="27.169999999999998">low 16 bits</tspan>
</text>
<polyline points="35,845 400,845" fill="none" stroke="#368c47" stroke-width="4" marker-end="url(#bus)"/>
<text x="410" y="1030" text-anchor="start" style="font-size:18px;" class="signal">
<tspan x="410" dy="0">sample_en → fft_sample_enable</tspan>
<tspan x="410" dy="25.74">sample_addr[5:0] → fft_sample_address[5:0]</tspan>
<tspan x="410" dy="25.74">sample_data[15:0] ← bram_rdata[15:0]</tspan>
</text>
<rect x="1310" y="620" width="740" height="860" rx="12" fill="#e5f0f7" stroke="#586d7c" stroke-width="2.5"/>
<text x="1330" y="656" text-anchor="start" style="font-size:25px;font-weight:700;">
<tspan x="1330" dy="0">U_NPU / npu_2pe</tspan>
</text>
<rect x="1370" y="720" width="620" height="160" rx="15" fill="#ffffff" stroke="#495b69" stroke-width="2.4"/>
<text x="1680.0" y="757" text-anchor="middle" style="font-size:23px;font-weight:700;">
<tspan x="1680.0" dy="0">입력·가중치·양자화 제어</tspan>
</text>
<text x="1680.0" y="793" text-anchor="middle" style="font-size:19px;">
<tspan x="1680.0" dy="0">input_select / weight_select / quantize</tspan>
<tspan x="1680.0" dy="27.169999999999998">4 inputs → 4 ReLU → 2 logits</tspan>
</text>
<polyline points="990,360 1140,360 1140,755 1370,755" fill="none" stroke="#3f4852" stroke-width="2.6" marker-end="url(#module)"/>
<text x="1160" y="490" text-anchor="start" style="font-size:19px;" class="signal">
<tspan x="1160" dy="0">npu_start → start</tspan>
<tspan x="1160" dy="27.169999999999998">features[31:0]</tspan>
</text>
<text x="1110" y="680" text-anchor="middle" style="font-size:16px;" class="signal">
<tspan x="1110" dy="0">FFT 결과는 코어 레지스터에 저장 후 NPU로 전달</tspan>
</text>
<rect x="1370" y="1160" width="275" height="180" rx="15" fill="#ffffff" stroke="#495b69" stroke-width="2.4"/>
<text x="1507.5" y="1197" text-anchor="middle" style="font-size:23px;font-weight:700;">
<tspan x="1507.5" dy="0">U_PE0 / mac_pe</tspan>
</text>
<text x="1507.5" y="1233" text-anchor="middle" style="font-size:19px;">
<tspan x="1507.5" dy="0">INT8 × INT8</tspan>
<tspan x="1507.5" dy="27.169999999999998">INT32 accumulate</tspan>
</text>
<rect x="1715" y="1160" width="275" height="180" rx="15" fill="#ffffff" stroke="#495b69" stroke-width="2.4"/>
<text x="1852.5" y="1197" text-anchor="middle" style="font-size:23px;font-weight:700;">
<tspan x="1852.5" dy="0">U_PE1 / mac_pe</tspan>
</text>
<text x="1852.5" y="1233" text-anchor="middle" style="font-size:19px;">
<tspan x="1852.5" dy="0">INT8 × INT8</tspan>
<tspan x="1852.5" dy="27.169999999999998">INT32 accumulate</tspan>
</text>
<polyline points="1455,880 1455,1160" fill="none" stroke="#3f4852" stroke-width="2.6" marker-end="url(#module)"/>
<text x="1335" y="970" text-anchor="start" style="font-size:17px;" class="signal">
<tspan x="1335" dy="0">input_value[7:0]</tspan>
<tspan x="1335" dy="24.31">pe0_weight[7:0]</tspan>
<tspan x="1335" dy="24.31">pe0_bias[31:0]</tspan>
<tspan x="1335" dy="24.31">clear_mac / enable_mac</tspan>
</text>
<polyline points="1800,880 1800,1160" fill="none" stroke="#3f4852" stroke-width="2.6" marker-end="url(#module)"/>
<text x="1740" y="970" text-anchor="start" style="font-size:17px;" class="signal">
<tspan x="1740" dy="0">input_value[7:0]</tspan>
<tspan x="1740" dy="24.31">pe1_weight[7:0]</tspan>
<tspan x="1740" dy="24.31">pe1_bias[31:0]</tspan>
<tspan x="1740" dy="24.31">clear_mac / enable_mac</tspan>
</text>
<polyline points="1590,1160 1590,880" fill="none" stroke="#3f4852" stroke-width="2.6" marker-end="url(#module)"/>
<text x="1605" y="1125" text-anchor="end" style="font-size:15px;" class="signal">
<tspan x="1605" dy="0">pe0_accumulator[31:0]</tspan>
</text>
<polyline points="1940,1160 1940,880" fill="none" stroke="#3f4852" stroke-width="2.6" marker-end="url(#module)"/>
<text x="1970" y="1125" text-anchor="end" style="font-size:15px;" class="signal">
<tspan x="1970" dy="0">pe1_accumulator[31:0]</tspan>
</text>
<text x="1400" y="1415" text-anchor="start" style="font-size:18px;">
<tspan x="1400" dy="0">ROM: w0.mem / w1.mem / bias.mem / shift.mem</tspan>
</text>
<polyline points="1310,1360 1190,1360 1190,440 990,440" fill="none" stroke="#3f4852" stroke-width="2.6" marker-end="url(#module)"/>
<text x="1210" y="1510" text-anchor="start" style="font-size:19px;" class="signal">
<tspan x="1210" dy="0">npu_done / npu_busy</tspan>
<tspan x="1210" dy="27.169999999999998">npu_hidden[31:0]</tspan>
<tspan x="1210" dy="27.169999999999998">npu_logits[15:0] / npu_class</tspan>
<tspan x="1210" dy="27.169999999999998">npu_cycles[31:0]</tspan>
</text>
<rect x="400" y="1510" width="590" height="210" rx="15" fill="#ffffff" stroke="#495b69" stroke-width="2.4"/>
<text x="695.0" y="1547" text-anchor="middle" style="font-size:23px;font-weight:700;">
<tspan x="695.0" dy="0">BRAM 포트 선택 / result_write_proc</tspan>
</text>
<text x="695.0" y="1583" text-anchor="middle" style="font-size:19px;">
<tspan x="695.0" dy="0">입력: word 0..63</tspan>
<tspan x="695.0" dy="27.169999999999998">결과: word 256..266 / 11 words</tspan>
<tspan x="695.0" dy="27.169999999999998">byte address = word address &lt;&lt; 2</tspan>
</text>
<polyline points="950,970 950,1510" fill="none" stroke="#3f4852" stroke-width="2.6" marker-end="url(#module)"/>
<polyline points="990,420 1050,420 1050,1480 700,1480 700,1510" fill="none" stroke="#3f4852" stroke-width="2.6" marker-end="url(#module)"/>
<text x="410" y="1460" text-anchor="start" style="font-size:17px;" class="signal">
<tspan x="410" dy="0">features / hidden / logits / class_id</tspan>
</text>
<polyline points="400,1600 35,1600" fill="none" stroke="#368c47" stroke-width="4" marker-end="url(#bus)"/>
<text x="35" y="1400" text-anchor="start" style="font-size:19px;" class="signal">
<tspan x="35" dy="0">bram_en</tspan>
<tspan x="35" dy="27.169999999999998">bram_we[3:0]</tspan>
<tspan x="35" dy="27.169999999999998">bram_addr[9:0]</tspan>
<tspan x="35" dy="27.169999999999998">bram_wdata[31:0]</tspan>
</text>
<text x="310" y="1835" text-anchor="start" style="font-size:18px;">
<tspan x="310" dy="0">공통: clk / rst → FFT·NPU·두 PE. 코어가 완료 결과를 보관하고 BRAM에 기록한다.</tspan>
</text>
<rect x="60" y="1960" width="2300" height="140" rx="12" fill="white" stroke="#586d7c" stroke-width="2.5"/>
<text x="80" y="1996" text-anchor="start" style="font-size:25px;font-weight:700;">
<tspan x="80" dy="0">범례 · Source-based module diagram</tspan>
</text>
<polyline points="85.0,2043 150.0,2043" fill="none" stroke="#368c47" stroke-width="4" marker-end="url(#bus)"/>
<text x="165.0" y="2050" text-anchor="start" style="font-size:19px;">
<tspan x="165.0" dy="0">AXI / BRAM 버스</tspan>
</text>
<polyline points="647.5,2043 712.5,2043" fill="none" stroke="#1688b5" stroke-width="4" marker-end="url(#io)"/>
<text x="727.5" y="2050" text-anchor="start" style="font-size:19px;">
<tspan x="727.5" dy="0">경계 입출력</tspan>
</text>
<polyline points="1210.0,2043 1275.0,2043" fill="none" stroke="#3f4852" stroke-width="2.6" marker-end="url(#module)"/>
<text x="1290.0" y="2050" text-anchor="start" style="font-size:19px;">
<tspan x="1290.0" dy="0">모듈 간 신호</tspan>
</text>
<polyline points="1772.5,2043 1837.5,2043" fill="none" stroke="#8058a6" stroke-width="2.6" marker-end="url(#clock)" stroke-dasharray="9 6"/>
<text x="1852.5" y="2050" text-anchor="start" style="font-size:19px;">
<tspan x="1852.5" dy="0">공통 클럭 / 리셋</tspan>
</text>
<text x="80" y="2085" text-anchor="start" style="font-size:17px;">
<tspan x="80" dy="0">흰색: 사용자 RTL·프로세스 / 보라색: Xilinx IP / 주황색: 메모리 / [n:0]: 비트 폭 / ●: 접속점 / 교차선은 접속 아님</tspan>
</text>
</svg>